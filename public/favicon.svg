<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Premium Warm Gold Gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Metallic Highlight Gradient -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4356" />
      <stop offset="50%" stop-color="#182A3A" />
      <stop offset="100%" stop-color="#0A141E" />
    </linearGradient>

    <!-- Core Gold Lettermark Gradient -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Dark Disc Gradient -->
    <radialGradient id="discBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1A2B3D" />
      <stop offset="60%" stop-color="#0F1B27" />
      <stop offset="100%" stop-color="#070E17" />
    </radialGradient>

    <!-- Depth Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Outer 16-Tooth Automotive Transmission Gear Ring -->
    <path d="
      M 46,2 L 54,2 L 55,8.5 L 61,10.2 L 66.5,5.8 L 72.8,9.5 L 71.5,16.2 L 77,18.8 L 83.2,15.5 L 88.5,20.2 L 85.5,26.5 L 90,30 L 96.8,28.2 L 99.8,34.5 L 95.2,39.5 L 97.5,45.5 L 102.5,46 L 102.5,54 L 97.5,54.5 L 95.2,60.5 L 99.8,65.5 L 96.8,71.8 L 90,70 L 85.5,73.5 L 88.5,79.8 L 83.2,84.5 L 77,81.2 L 71.5,83.8 L 72.8,90.5 L 66.5,94.2 L 61,89.8 L 55,91.5 L 54,98 L 46,98 L 45,91.5 L 39,89.8 L 33.5,94.2 L 27.2,90.5 L 28.5,83.8 L 23,81.2 L 16.8,84.5 L 11.5,79.8 L 14.5,73.5 L 10,70 L 3.2,71.8 L 0.2,65.5 L 4.8,60.5 L 2.5,54.5 L -2.5,54 L -2.5,46 L 2.5,45.5 L 4.8,39.5 L 0.2,34.5 L 3.2,28.2 L 10,30 L 14.5,26.5 L 11.5,20.2 L 16.8,15.5 L 23,18.8 L 28.5,16.2 L 27.2,9.5 L 33.5,5.8 L 39,10.2 L 45,8.5 Z"
      transform="scale(0.92) translate(4.5, 4.5)"
      fill="url(#goldOuter)"
      stroke="#78350F"
      stroke-width="0.8"
    />

    <!-- Outer Gold Stepped Rim -->
    <circle cx="50" cy="50" r="39" fill="url(#metalRing)" stroke="url(#goldOuter)" stroke-width="2" />
    <circle cx="50" cy="50" r="36" fill="none" stroke="#FBBF24" stroke-width="0.75" stroke-dasharray="1 1.5" opacity="0.8" />

    <!-- Deep Metallic Midnight Navy Disc -->
    <circle cx="50" cy="50" r="34" fill="url(#discBg)" stroke="#1E293B" stroke-width="1.2" />

    <!-- Concentric Precision Milling Tracks -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#334155" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6" />
    <circle cx="50" cy="50" r="23" fill="none" stroke="#1E293B" stroke-width="0.5" />

    <!-- Iconic Stylized Mechanical "G" & Transmission Ring -->
    <!-- The bold "G" sculpted with speed cuts and transmission teeth -->
    <path d="
      M 51,24
      C 37,24 26,35 26,49.5
      C 26,64 37,75 51,75
      C 61.5,75 70,68 73,59.5
      L 62.5,59.5
      C 60,64 56,66.5 51,66.5
      C 41.5,66.5 34.5,59 34.5,49.5
      C 34.5,40 41.5,32.5 51,32.5
      C 56.5,32.5 61,35 63.8,39
      L 71.5,32.5
      C 66.5,27.2 59.2,24 51,24 Z"
      fill="url(#goldCore)"
      stroke="#78350F"
      stroke-width="0.6"
    />

    <!-- The Crossbar of the "G" with Mechanical Pinion Interlock -->
    <path d="
      M 50,45.5
      L 73,45.5
      L 73,53.5
      L 58,53.5
      L 58,51
      L 50,51 Z"
      fill="url(#goldCore)"
      stroke="#78350F"
      stroke-width="0.5"
    />

    <!-- Precision Mechanical Accent: Transmission Axle Center Bolt -->
    <circle cx="50" cy="50" r="4" fill="url(#metalRing)" stroke="url(#goldOuter)" stroke-width="1.2" />
    <polygon points="50,48 51.8,49 51.8,51 50,52 48.2,51 48.2,49" fill="#FDE68A" />

    <!-- Transmission Pinion Teeth Detail in Negative Space (3 cogs) -->
    <rect x="29" y="47.5" width="2.5" height="4" rx="0.5" fill="#F59E0B" opacity="0.9" />
    <rect x="48" y="27" width="4" height="2.5" rx="0.5" fill="#F59E0B" opacity="0.9" />
    <rect x="48" y="70.5" width="4" height="2.5" rx="0.5" fill="#F59E0B" opacity="0.9" />
  </g>
</svg>
